<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विद्यार्थी व ॲडमिन लॉगिन | महाराष्ट्र पोलीस भरती परीक्षा पोर्टल</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts & Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- १. नेव्हिगेशन हेडर -->
    <header class="bg-slate-900 border-b border-slate-800 text-white py-3.5 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-bold text-lg shadow-md">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <span class="font-bold text-base sm:text-lg text-white">पोलीस भरती परीक्षा पोर्टल</span>
            </a>
            <a href="register.html" class="text-sm text-amber-400 hover:text-amber-300 font-semibold transition flex items-center">
                <i class="fa-solid fa-user-plus mr-1.5"></i> नवीन नोंदणी
            </a>
        </div>
    </header>

    <!-- २. मुख्य लॉगिन फॉर्म कार्ड -->
    <main class="flex-grow flex items-center justify-center px-4 py-10 sm:py-14">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <!-- कार्ड हेडर -->
            <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 p-6 text-white text-center border-b border-slate-800">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-2xl mb-3 shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-extrabold tracking-wide">पोर्टल लॉगिन</h2>
                <p class="text-xs sm:text-sm text-slate-300 mt-1">
                    परीक्षार्थी व ॲडमिनसाठी सुरक्षित लॉगिन
                </p>
            </div>

            <!-- लॉगिन फॉर्म -->
            <form id="loginForm" class="p-6 sm:p-8 space-y-4">
                <!-- युजरनेम / मोबाईल नंबर -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        <i class="fa-solid fa-phone text-amber-500 mr-1"></i> १० अंकी मोबाईल नंबर (किंवा ईमेल) *
                    </label>
                    <input 
                        type="text" 
                        id="identifier" 
                        required 
                        placeholder="उदा. 9876543210"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition font-medium"
                    >
                </div>

                <!-- पासवर्ड -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                            <i class="fa-solid fa-key text-amber-500 mr-1"></i> पासवर्ड *
                        </label>
                        <a href="forgot-password.html" class="text-xs font-semibold text-blue-600 hover:text-blue-800 hover:underline">
                            पासवर्ड विसरलात?
                        </a>
                    </div>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            required 
                            placeholder="••••••••"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition pr-10"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 text-sm"
                        >
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- लॉगिन बटन -->
                <div class="pt-3">
                    <button 
                        type="submit" 
                        id="loginBtn"
                        class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 bg-amber-500 hover:bg-amber-400 shadow-lg hover:shadow-amber-500/25 transition-all text-base flex items-center justify-center space-x-2"
                    >
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>लॉगिन करा (Login)</span>
                    </button>
                </div>
            </form>

            <!-- कार्ड तळटीप -->
            <div class="p-4 bg-slate-50 border-t border-slate-200 text-center text-xs text-slate-600">
                नवीन विद्यार्थी आहात का? 
                <a href="register.html" class="text-amber-600 font-bold hover:underline ml-1">येथे नवीन नोंदणी करा</a>
            </div>
        </div>
    </main>

    <!-- ३. सामान्य फूटर -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-4 text-center border-t border-slate-800">
        महाराष्ट्र पोलीस भरती सराव परीक्षा पोर्टल &copy; २०२५-२०२६.
    </footer>

    <!-- Supabase आणि स्क्रिप्ट्स -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const identifierInput = document.getElementById('identifier');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const toggleIcon = document.getElementById('toggleIcon');

        // पासवर्ड लपवा / दाखवा
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const identifier = identifierInput.value.trim();
            const password = passwordInput.value;

            if (!identifier || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'अपूर्ण माहिती',
                    text: 'कृपया मोबाईल नंबर आणि पासवर्ड दोन्ही प्रविष्ट करा.',
                    confirmButtonColor: '#f59e0b',
                    confirmButtonText: 'समजले'
                });
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> पडताळणी सुरू आहे...';

            try {
                const res = await DB.login(identifier, password);

                if (res.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'लॉगिन यशस्वी!',
                        text: res.user.role === 'admin' 
                            ? 'ॲडमिन पॅनेलवर घेऊन जात आहोत...' 
                            : 'सराव पेपर्स डॅशबोर्डवर घेऊन जात आहोत...',
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = res.redirectTo || 'dashboard.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'लॉगिन अयशस्वी',
                        text: res.message || 'मोबाईल नंबर किंवा पासवर्ड चुकीचा आहे.',
                        confirmButtonColor: '#dc2626',
                        confirmButtonText: 'पुन्हा प्रयत्न करा'
                    });
                }
            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'त्रुटी',
                    text: (err && err.message) ? err.message : 'लॉगिन करताना तांत्रिक अडचण आली.',
                    confirmButtonColor: '#dc2626',
                    confirmButtonText: 'ठीक आहे'
                });
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> लॉगिन करा (Login)';
            }
        });
    </script>
</body>
</html>
