<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पासवर्ड रीसेट करा | महाराष्ट्र पोलीस भरती परीक्षा पोर्टल</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts & Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- १. नेव्हिगेशन हेडर -->
    <header class="bg-slate-900 border-b border-slate-800 text-white py-3.5 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center font-bold text-lg shadow-md">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <span class="font-bold text-base sm:text-lg text-white">पोलीस भरती परीक्षा पोर्टल</span>
            </a>
            <a href="login.html" class="text-sm text-slate-300 hover:text-amber-400 font-medium transition flex items-center">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> लॉगिनवर परत जा
            </a>
        </div>
    </header>

    <!-- २. मुख्य पासवर्ड रीसेट कार्ड -->
    <main class="flex-grow flex items-center justify-center px-4 py-10 sm:py-14">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <!-- कार्ड हेडर -->
            <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 p-6 text-white text-center border-b border-slate-800">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-2xl mb-3 shadow-inner">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 class="text-2xl font-extrabold tracking-wide">पासवर्ड विसरलात?</h2>
                <p class="text-xs sm:text-sm text-slate-300 mt-1">
                    ईमेल लिंकची वाट न पाहता थेट मोबाईल व ईमेल पडताळणीने पासवर्ड बदला.
                </p>
            </div>

            <div class="p-6 sm:p-8 space-y-6">
                <!-- टप्पा १: पडताळणी फॉर्म (Verification Step) -->
                <form id="verifyForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            <i class="fa-solid fa-phone text-amber-500 mr-1"></i> नोंदणीकृत १०-अंकी मोबाईल नंबर *
                        </label>
                        <input 
                            type="tel" 
                            id="verifyMobile" 
                            required 
                            maxlength="10" 
                            placeholder="उदा. 9876543210"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition font-medium"
                        >
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                            <i class="fa-solid fa-envelope text-amber-500 mr-1"></i> नोंदणीकृत ईमेल आयडी *
                        </label>
                        <input 
                            type="email" 
                            id="verifyEmail" 
                            required 
                            placeholder="उदा. rahul.patil@gmail.com"
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 text-sm outline-none transition"
                        >
                    </div>

                    <button 
                        type="submit" 
                        id="verifyBtn"
                        class="w-full py-3 px-4 rounded-xl font-bold text-slate-950 bg-amber-500 hover:bg-amber-400 shadow-md transition-all text-sm flex items-center justify-center space-x-2"
                    >
                        <i class="fa-solid fa-shield-check"></i>
                        <span>माहिती तपासा व पुढे जा</span>
                    </button>
                </form>

                <!-- टप्पा २: नवीन पासवर्ड फॉर्म (फक्त पडताळणी यशस्वी झाल्यावर दिसेल) -->
                <div id="newPasswordSection" class="hidden pt-4 border-t border-slate-200">
                    <div class="p-3 bg-emerald-50 text-emerald-800 rounded-xl border border-emerald-200 text-xs mb-4 flex items-center">
                        <i class="fa-solid fa-circle-check text-emerald-600 text-base mr-2"></i>
                        <span>माहिती पडताळणी यशस्वी! आता नवीन पासवर्ड टाका.</span>
                    </div>

                    <form id="resetForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                                <i class="fa-solid fa-lock text-emerald-600 mr-1"></i> नवीन पासवर्ड (किमान ६ अक्षरे) *
                            </label>
                            <input 
                                type="password" 
                                id="newPassword" 
                                required 
                                minlength="6"
                                placeholder="••••••••"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm outline-none transition"
                            >
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                                <i class="fa-solid fa-check-double text-emerald-600 mr-1"></i> नवीन पासवर्ड खात्री करा *
                            </label>
                            <input 
                                type="password" 
                                id="confirmNewPassword" 
                                required 
                                minlength="6"
                                placeholder="••••••••"
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm outline-none transition"
                            >
                        </div>

                        <button 
                            type="submit" 
                            id="resetBtn"
                            class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 shadow-lg transition-all text-sm flex items-center justify-center space-x-2"
                        >
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>नवीन पासवर्ड जतन करा (Save Password)</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- कार्ड तळटीप -->
            <div class="p-4 bg-slate-50 border-t border-slate-200 text-center text-xs text-slate-600">
                पासवर्ड आठवला का? 
                <a href="login.html" class="text-blue-700 font-bold hover:underline ml-1">येथे लॉगिन करा</a>
            </div>
        </div>
    </main>

    <!-- ३. सामान्य फूटर -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-4 text-center border-t border-slate-800">
        महाराष्ट्र पोलीस भरती सराव परीक्षा पोर्टल &copy; २०२५-२०२६.
    </footer>

    <!-- Supabase आणि स्क्रिप्ट्स -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const verifyForm = document.getElementById('verifyForm');
        const verifyBtn = document.getElementById('verifyBtn');
        const verifyMobile = document.getElementById('verifyMobile');
        const verifyEmail = document.getElementById('verifyEmail');

        const newPasswordSection = document.getElementById('newPasswordSection');
        const resetForm = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const newPassword = document.getElementById('newPassword');
        const confirmNewPassword = document.getElementById('confirmNewPassword');

        let verifiedMobile = '';
        let verifiedEmail = '';

        // टप्पा १: मोबाईल व ईमेल पडताळणी
        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const mobile = verifyMobile.value.trim();
            const email = verifyEmail.value.trim();

            if (!/^\d{10}$/.test(mobile)) {
                Swal.fire({
                    icon: 'warning',
                    title: 'अवैध मोबाईल नंबर',
                    text: 'कृपया बरोबर १० अंकी मोबाईल नंबर टाका.',
                    confirmButtonColor: '#f59e0b'
                });
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> पडताळणी सुरू आहे...';

            try {
                const isValid = await DB.verifyMobileEmail(mobile, email);

                if (isValid) {
                    verifiedMobile = mobile;
                    verifiedEmail = email;

                    // इनपुट्स लॉक करणे
                    verifyMobile.disabled = true;
                    verifyEmail.disabled = true;
                    verifyBtn.classList.add('hidden');

                    // टप्पा २ उघडणे
                    newPasswordSection.classList.remove('hidden');
                    newPassword.focus();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'माहिती जुळली नाही',
                        text: 'प्रविष्ट केलेला मोबाईल नंबर आणि ईमेल आयडी डेटाबेसमध्ये जुळत नाहीत.',
                        confirmButtonColor: '#dc2626',
                        confirmButtonText: 'पुन्हा तपासा'
                    });
                }
            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'त्रुटी',
                    text: (err && err.message) ? err.message : 'पडताळणी करताना तांत्रिक अडचण आली.',
                    confirmButtonColor: '#dc2626'
                });
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = '<i class="fa-solid fa-shield-check mr-2"></i> माहिती तपासा व पुढे जा';
            }
        });

        // टप्पा २: नवीन पासवर्ड अपडेट करणे
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const pwd = newPassword.value;
            const confirmPwd = confirmNewPassword.value;

            if (pwd.length < 6) {
                Swal.fire({
                    icon: 'warning',
                    title: 'कमी लांबीचा पासवर्ड',
                    text: 'पासवर्ड किमान ६ अक्षरांचा असावा.',
                    confirmButtonColor: '#f59e0b'
                });
                return;
            }

            if (pwd !== confirmPwd) {
                Swal.fire({
                    icon: 'error',
                    title: 'पासवर्ड जुळत नाही',
                    text: 'दोन्ही पासवर्ड एकसारखे असणे आवश्यक आहे.',
                    confirmButtonColor: '#dc2626'
                });
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> सेव्ह होत आहे...';

            try {
                const res = await DB.resetPassword(verifiedMobile, verifiedEmail, pwd);

                if (res.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'पासवर्ड यशस्वीरित्या बदलला!',
                        text: 'आता तुम्ही तुमच्या नवीन पासवर्डने लॉगिन करू शकता.',
                        confirmButtonColor: '#10b981',
                        confirmButtonText: 'लॉगिन करा',
                        allowOutsideClick: false
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'त्रुटी',
                        text: res.message || 'पासवर्ड बदलताना अडचण आली.',
                        confirmButtonColor: '#dc2626'
                    });
                }
            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'त्रुटी',
                    text: (err && err.message) ? err.message : 'तांत्रिक अडचणीमुळे पासवर्ड बदलता आला नाही.',
                    confirmButtonColor: '#dc2626'
                });
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> नवीन पासवर्ड जतन करा (Save Password)';
            }
        });
    </script>
</body>
</html>
